[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-control-hud"
version = "0.1.0"
description = "Native Android HUD backend for ZCode task state and CommandCode usage"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.scripts]
ai-control-hub-backup = "tools.hub_backup:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["server*", "tools*"]
exclude = ["android*"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["server/tests", "tools/tests"]

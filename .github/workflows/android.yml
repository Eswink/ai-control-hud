name: Android CI

on:
  push:
    paths:
      - 'android/**'
      - 'scripts/ci-android-apk-secret-scan.py'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'scripts/ci-android-apk-secret-scan.py'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android 35 SDK
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Verify APK secret scanner rejects a synthetic leak
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/leaky.apk', 'w') as archive:
              archive.writestr('classes.dex', b'prefix HUD_HUB_AGENT_TOKEN suffix')
          PY
          if python3 scripts/ci-android-apk-secret-scan.py /tmp/leaky.apk; then
            echo 'secret scanner accepted a synthetic leak' >&2
            exit 1
          fi

      - name: Lint, test, and assemble debug APK
        working-directory: android
        run: gradle --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug

      - name: Scan debug APK for credential artifacts
        run: python3 scripts/ci-android-apk-secret-scan.py android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ai-control-hud-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

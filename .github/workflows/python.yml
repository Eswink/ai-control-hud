name: Python CI

on:
  push:
    paths:
      - 'pyproject.toml'
      - 'server/**'
      - 'tools/**'
      - '.github/workflows/python.yml'
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'server/**'
      - 'tools/**'
      - '.github/workflows/python.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install editable package and dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

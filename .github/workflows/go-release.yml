name: Go Agent Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without a leading v
        required: true
        default: 0.3.0-rc.1
        type: string
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'agent/**'
      - 'scripts/package-agent-release.py'
      - 'scripts/ai-control-agent-systemd.sh'
      - 'scripts/ai-control-agent-launchd.sh'
      - 'scripts/ai-control-agent-unix-upgrade.sh'
      - 'scripts/hub_bundle.py'
      - 'scripts/package-hub-bundle.py'
      - 'scripts/package-h3-validation.py'
      - 'scripts/go_release_manifest.py'
      - 'scripts/ai-control-hub-systemd.sh'
      - 'scripts/ai-control-hub-lan-doctor.sh'
      - 'scripts/ai-control-hub-upgrade.sh'
      - 'docs/G7_CROSS_PLATFORM.md'
      - 'docs/HUB_DEPLOYMENT.md'
      - 'docs/HUB_LAN_DOCTOR.md'
      - 'docs/HUB_UPGRADE.md'
      - 'docs/GO_RELEASE.md'
      - 'docs/GO_RELEASE_MANIFEST.md'
      - '.github/workflows/go-release.yml'

concurrency:
  group: go-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            target: windows-amd64
            binary: ai-control-agent.exe
            format: zip
          - goos: linux
            goarch: amd64
            target: linux-amd64
            binary: ai-control-agent
            format: tar.gz
          - goos: darwin
            goarch: amd64
            target: darwin-amd64
            binary: ai-control-agent
            format: tar.gz
          - goos: darwin
            goarch: arm64
            target: darwin-arm64
            binary: ai-control-agent
            format: tar.gz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache: false

      - name: Resolve version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) version="$INPUT_VERSION" ;;
            pull_request) version="0.0.0-pr.$PR_NUMBER" ;;
            *) version="${REF_NAME#v}" ;;
          esac
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Reproducible Agent cross-build
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist build-a build-b
          ldflags="-s -w -buildid= -X main.version=$VERSION"
          (
            cd agent
            go build -trimpath -buildvcs=false -ldflags "$ldflags" -o "../build-a/${{ matrix.binary }}" ./cmd/ai-control-agent
            go build -trimpath -buildvcs=false -ldflags "$ldflags" -o "../build-b/${{ matrix.binary }}" ./cmd/ai-control-agent
          )
          cmp "build-a/${{ matrix.binary }}" "build-b/${{ matrix.binary }}"
          cp "build-a/${{ matrix.binary }}" "dist/${{ matrix.binary }}"
          archive="ai-control-agent_${VERSION}_${{ matrix.target }}.${{ matrix.format }}"
          extra_args=()
          case "${{ matrix.goos }}" in
            linux)
              extra_args+=(
                --extra "scripts/ai-control-agent-systemd.sh=ai-control-agent-systemd.sh"
                --extra "scripts/ai-control-agent-unix-upgrade.sh=ai-control-agent-unix-upgrade.sh"
              )
              ;;
            darwin)
              extra_args+=(
                --extra "scripts/ai-control-agent-launchd.sh=ai-control-agent-launchd.sh"
                --extra "scripts/ai-control-agent-unix-upgrade.sh=ai-control-agent-unix-upgrade.sh"
              )
              ;;
          esac
          python3 scripts/package-agent-release.py \
            --binary "dist/${{ matrix.binary }}" \
            --output "dist/$archive" \
            --archive-name "${{ matrix.binary }}" \
            --format "${{ matrix.format }}" \
            "${extra_args[@]}"
          rm "dist/${{ matrix.binary }}"
          (cd dist && sha256sum "$archive" > "$archive.sha256")
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Verify Agent archive contents
        shell: bash
        run: |
          set -euo pipefail
          rm -rf verify
          mkdir -p verify
          case "${{ matrix.format }}" in
            zip) unzip -q "dist/$ARCHIVE" -d verify ;;
            tar.gz) gzip -dc "dist/$ARCHIVE" | tar -xf - -C verify ;;
          esac
          test -f "verify/${{ matrix.binary }}"
          case "${{ matrix.goos }}" in
            windows)
              test ! -e verify/ai-control-agent-unix-upgrade.sh
              ;;
            linux)
              test -x verify/ai-control-agent
              test -x verify/ai-control-agent-systemd.sh
              test -x verify/ai-control-agent-unix-upgrade.sh
              test ! -e verify/ai-control-agent-launchd.sh
              test "$(verify/ai-control-agent version)" = "$VERSION"
              ;;
            darwin)
              test -x verify/ai-control-agent
              test -x verify/ai-control-agent-launchd.sh
              test -x verify/ai-control-agent-unix-upgrade.sh
              test ! -e verify/ai-control-agent-systemd.sh
              ;;
          esac

      - name: Upload Agent target artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-agent-${{ matrix.target }}
          path: |
            dist/${{ env.ARCHIVE }}
            dist/${{ env.ARCHIVE }}.sha256
          if-no-files-found: error
          retention-days: 30

  hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache: false

      - name: Resolve version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) version="$INPUT_VERSION" ;;
            pull_request) version="0.0.0-pr.$PR_NUMBER" ;;
            *) version="${REF_NAME#v}" ;;
          esac
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Reproducible static Go Hub build
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          mkdir -p dist build-a build-b
          ldflags="-s -w -buildid= -X main.version=$VERSION"
          (
            cd agent
            go build -trimpath -buildvcs=false -ldflags "$ldflags" -o ../build-a/ai-control-hub ./cmd/ai-control-hub
            go build -trimpath -buildvcs=false -ldflags "$ldflags" -o ../build-b/ai-control-hub ./cmd/ai-control-hub
          )
          cmp build-a/ai-control-hub build-b/ai-control-hub
          cp build-a/ai-control-hub dist/ai-control-hub
          test "$(dist/ai-control-hub version)" = "$VERSION"
          file dist/ai-control-hub | grep -Fq 'statically linked'

      - name: Package production Hub bundle
        shell: bash
        run: |
          set -euo pipefail
          archive="ai-control-hub_${VERSION}_linux-amd64.zip"
          python3 scripts/package-hub-bundle.py \
            --hub-binary dist/ai-control-hub \
            --version "$VERSION" \
            --output "dist/$archive"
          rm dist/ai-control-hub
          (cd dist && sha256sum "$archive" > "$archive.sha256")
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Verify Hub bundle metadata and embedded version
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          unzip -q "dist/$ARCHIVE" -d "$tmp"
          test "$("$tmp/ai-control-hub" version)" = "$VERSION"
          grep -Fxq 'bundle_schema=1' "$tmp/BUILD_INFO.txt"
          grep -Fxq 'component=ai-control-hub' "$tmp/BUILD_INFO.txt"
          grep -Fxq "version=$VERSION" "$tmp/BUILD_INFO.txt"
          grep -Fxq 'entrypoint=docs/HUB_DEPLOYMENT.md' "$tmp/BUILD_INFO.txt"
          (
            cd "$tmp"
            sha256sum -c SHA256SUMS
          )
          test -f "$tmp/scripts/ai-control-hub-systemd.sh"
          test -f "$tmp/scripts/ai-control-hub-lan-doctor.sh"
          test -f "$tmp/scripts/ai-control-hub-upgrade.sh"
          test -f "$tmp/docs/HUB_DEPLOYMENT.md"
          test -f "$tmp/docs/HUB_UPGRADE.md"

      - name: Upload Hub target artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-hub-linux-amd64
          path: |
            dist/${{ env.ARCHIVE }}
            dist/${{ env.ARCHIVE }}.sha256
          if-no-files-found: error
          retention-days: 30

  manifest:
    needs: [build, hub]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) version="$INPUT_VERSION" ;;
            pull_request) version="0.0.0-pr.$PR_NUMBER" ;;
            *) version="${REF_NAME#v}" ;;
          esac
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Download target artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify target checksums and build unified manifests
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for checksum in *.sha256; do
            sha256sum -c "$checksum"
          done
          find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          grep -Fq "ai-control-agent_${VERSION}_windows-amd64.zip" SHA256SUMS
          grep -Fq "ai-control-hub_${VERSION}_linux-amd64.zip" SHA256SUMS
          cd ..
          python3 scripts/go_release_manifest.py build \
            --version "$VERSION" \
            --commit "$GITHUB_SHA" \
            --output dist/RELEASE_MANIFEST.json \
            --artifact "ai-control-agent:windows-amd64:dist/ai-control-agent_${VERSION}_windows-amd64.zip" \
            --artifact "ai-control-agent:linux-amd64:dist/ai-control-agent_${VERSION}_linux-amd64.tar.gz" \
            --artifact "ai-control-agent:darwin-amd64:dist/ai-control-agent_${VERSION}_darwin-amd64.tar.gz" \
            --artifact "ai-control-agent:darwin-arm64:dist/ai-control-agent_${VERSION}_darwin-arm64.tar.gz" \
            --artifact "ai-control-hub:linux-amd64:dist/ai-control-hub_${VERSION}_linux-amd64.zip"
          python3 scripts/go_release_manifest.py verify \
            --manifest dist/RELEASE_MANIFEST.json \
            --directory dist
          cat dist/RELEASE_MANIFEST.json

      - name: Upload combined Go release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ai-control-hud-go-release-${{ env.VERSION }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  attest:
    if: github.event_name != 'pull_request'
    needs: manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Resolve version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          else
            version="${REF_NAME#v}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Download combined Go release artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: ai-control-hud-go-release-${{ env.VERSION }}
          path: dist

      - name: Attest Go release archives and manifests
        uses: actions/attest@v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/RELEASE_MANIFEST.json

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [manifest, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Download combined Go release artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: ai-control-hud-go-release-${{ env.VERSION }}
          path: dist

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --generate-notes \
            --title "AI Control HUD $VERSION"

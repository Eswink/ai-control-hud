name: Android Release

on:
  pull_request:
    paths:
      - 'android/**'
      - 'scripts/ci-android-apk-secret-scan.py'
      - '.github/workflows/android-release.yml'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android 35 SDK
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Build unsigned release gate on pull requests
        if: github.event_name == 'pull_request'
        working-directory: android
        run: gradle --no-daemon :app:lintRelease :app:testReleaseUnitTest :app:assembleRelease

      - name: Scan unsigned release gate
        if: github.event_name == 'pull_request'
        run: python3 scripts/ci-android-apk-secret-scan.py android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Validate and materialize release signing secret
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          HUD_ANDROID_KEYSTORE_BASE64: ${{ secrets.HUD_ANDROID_KEYSTORE_BASE64 }}
          HUD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HUD_ANDROID_KEYSTORE_PASSWORD }}
          HUD_ANDROID_KEY_ALIAS: ${{ secrets.HUD_ANDROID_KEY_ALIAS }}
          HUD_ANDROID_KEY_PASSWORD: ${{ secrets.HUD_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in \
            HUD_ANDROID_KEYSTORE_BASE64 \
            HUD_ANDROID_KEYSTORE_PASSWORD \
            HUD_ANDROID_KEY_ALIAS \
            HUD_ANDROID_KEY_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              echo "required GitHub Secret is not configured: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$HUD_ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/ai-control-hud-release.jks"
          chmod 600 "${RUNNER_TEMP}/ai-control-hud-release.jks"
          test -s "${RUNNER_TEMP}/ai-control-hud-release.jks"

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        working-directory: android
        env:
          HUD_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ai-control-hud-release.jks
          HUD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HUD_ANDROID_KEYSTORE_PASSWORD }}
          HUD_ANDROID_KEY_ALIAS: ${{ secrets.HUD_ANDROID_KEY_ALIAS }}
          HUD_ANDROID_KEY_PASSWORD: ${{ secrets.HUD_ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:lintRelease :app:testReleaseUnitTest :app:assembleRelease

      - name: Verify signed release APK
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          apk='android/app/build/outputs/apk/release/app-release.apk'
          test -f "$apk"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          python3 scripts/ci-android-apk-secret-scan.py "$apk"
          sha256sum "$apk" > android/app/build/outputs/apk/release/app-release.apk.sha256

      - name: Upload signed release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ai-control-hud-release-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Remove materialized signing key
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/ai-control-hud-release.jks"

name: Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Android versionName for this manual release
        required: true
        default: '0.1.0'
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android 35 SDK
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Resolve release version
        shell: bash
        env:
          MANUAL_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          version_name="$MANUAL_VERSION_NAME"
          if ! [[ "$version_name" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]{0,99}$ ]]; then
            echo 'release versionName contains unsupported characters or length' >&2
            exit 1
          fi
          version_code="$GITHUB_RUN_NUMBER"
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo 'release workflow run number cannot be used as Android versionCode' >&2
            exit 1
          fi
          echo "HUD_ANDROID_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "HUD_ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "release versionName=$version_name versionCode=$version_code"

      - name: Validate and materialize release signing secret
        shell: bash
        env:
          HUD_ANDROID_KEYSTORE_BASE64: ${{ secrets.HUD_ANDROID_KEYSTORE_BASE64 }}
          HUD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HUD_ANDROID_KEYSTORE_PASSWORD }}
          HUD_ANDROID_KEY_ALIAS: ${{ secrets.HUD_ANDROID_KEY_ALIAS }}
          HUD_ANDROID_KEY_PASSWORD: ${{ secrets.HUD_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in \
            HUD_ANDROID_KEYSTORE_BASE64 \
            HUD_ANDROID_KEYSTORE_PASSWORD \
            HUD_ANDROID_KEY_ALIAS \
            HUD_ANDROID_KEY_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              echo "required GitHub Secret is not configured: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$HUD_ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/ai-control-hud-release.jks"
          chmod 600 "${RUNNER_TEMP}/ai-control-hud-release.jks"
          test -s "${RUNNER_TEMP}/ai-control-hud-release.jks"

      - name: Build signed release APK
        working-directory: android
        env:
          HUD_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ai-control-hud-release.jks
          HUD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HUD_ANDROID_KEYSTORE_PASSWORD }}
          HUD_ANDROID_KEY_ALIAS: ${{ secrets.HUD_ANDROID_KEY_ALIAS }}
          HUD_ANDROID_KEY_PASSWORD: ${{ secrets.HUD_ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:lintRelease :app:testReleaseUnitTest :app:assembleRelease

      - name: Verify signed release APK and metadata
        shell: bash
        run: |
          set -euo pipefail
          out='android/app/build/outputs/apk/release'
          apk="$out/app-release.apk"
          test -f "$apk"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          badging="$("${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$apk" | head -n 1)"
          grep -F "versionCode='${HUD_ANDROID_VERSION_CODE}'" <<<"$badging"
          grep -F "versionName='${HUD_ANDROID_VERSION_NAME}'" <<<"$badging"
          python3 scripts/ci-android-apk-secret-scan.py "$apk"
          sha256sum "$apk" > "$out/app-release.apk.sha256"
          cat > "$out/release-metadata.txt" <<EOF
          applicationId=dev.eswink.aicontrolhud
          versionName=${HUD_ANDROID_VERSION_NAME}
          versionCode=${HUD_ANDROID_VERSION_CODE}
          commit=${GITHUB_SHA}
          ref=${GITHUB_REF_NAME}
          workflowRunId=${GITHUB_RUN_ID}
          EOF

      - name: Upload signed release APK
        uses: actions/upload-artifact@v7
        with:
          name: ai-control-hud-release-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256
            android/app/build/outputs/apk/release/release-metadata.txt
          if-no-files-found: error
          retention-days: 90

      - name: Remove materialized signing key
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/ai-control-hud-release.jks"

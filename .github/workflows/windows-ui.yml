name: Windows Native UI CI

on:
  push:
    paths:
      - 'windows-ui/**'
      - 'scripts/ci-windows-native-ui.py'
      - 'scripts/ci-windows-ui-artifact-scan.py'
      - 'scripts/ci-windows-ui-resource-smoke.ps1'
      - '.github/workflows/windows-ui.yml'
      - 'agent/internal/api/**'
      - 'agent/internal/domain/**'
  pull_request:
    paths:
      - 'windows-ui/**'
      - 'scripts/ci-windows-native-ui.py'
      - 'scripts/ci-windows-ui-artifact-scan.py'
      - 'scripts/ci-windows-ui-resource-smoke.ps1'
      - '.github/workflows/windows-ui.yml'
      - 'agent/internal/api/**'
      - 'agent/internal/domain/**'
  workflow_dispatch:

concurrency:
  group: windows-native-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enforce native low-resource architecture
        shell: pwsh
        run: python scripts/ci-windows-native-ui.py

      - name: Configure native UI
        shell: pwsh
        run: cmake -S windows-ui -B build/windows-ui -A x64

      - name: Build native UI
        shell: pwsh
        run: cmake --build build/windows-ui --config Release --parallel

      - name: Run native model tests
        shell: pwsh
        run: ctest --test-dir build/windows-ui -C Release --output-on-failure

      - name: Prove native artifact secret scanner
        shell: pwsh
        run: |
          $probe = 'build/windows-ui/synthetic-secret.bin'
          [System.IO.File]::WriteAllText($probe, 'HUD_HUB_AGENT_TOKEN')
          & python scripts/ci-windows-ui-artifact-scan.py $probe
          if ($LASTEXITCODE -eq 0) {
            throw 'synthetic credential marker was not detected'
          }
          Remove-Item -LiteralPath $probe -Force
          Write-Host '[windows-ui-artifact-scan] synthetic failure path verified'

      - name: Scan native Windows UI artifact
        shell: pwsh
        run: python scripts/ci-windows-ui-artifact-scan.py build/windows-ui/Release/ai-control-agent-ui.exe

      - name: Native startup resource and leak smoke
        shell: pwsh
        run: |
          ./scripts/ci-windows-ui-resource-smoke.ps1 `
            -Exe 'build/windows-ui/Release/ai-control-agent-ui.exe' `
            -MetricsPath 'build/windows-ui/resource-metrics.json'

      - name: Upload native Windows UI delivery bundle
        uses: actions/upload-artifact@v7
        with:
          name: ai-control-agent-ui-windows-amd64
          path: |
            build/windows-ui/Release/ai-control-agent-ui.exe
            build/windows-ui/resource-metrics.json
          if-no-files-found: error
          retention-days: 30

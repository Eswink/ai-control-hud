name: Go Agent CI

on:
  push:
    paths:
      - 'agent/**'
      - 'server/tests/fixtures/**'
      - 'scripts/ai-control-agent-systemd.sh'
      - 'scripts/ai-control-agent-launchd.sh'
      - 'scripts/ai-control-agent-unix-upgrade.sh'
      - 'scripts/ci-agent-runtime-smoke.py'
      - 'scripts/ci-agent-systemd-identity-smoke.sh'
      - 'scripts/ci-g6-windows-service-smoke.ps1'
      - 'scripts/ci-g7-unix-service-smoke.sh'
      - 'scripts/fixtures/broken-service-agent.go'
      - 'scripts/g4_state_db.py'
      - 'docs/API.md'
      - 'docs/G6_WINDOWS_SERVICE.md'
      - 'docs/G7_CROSS_PLATFORM.md'
      - '.github/workflows/go-agent.yml'
  pull_request:
    paths:
      - 'agent/**'
      - 'server/tests/fixtures/**'
      - 'scripts/ai-control-agent-systemd.sh'
      - 'scripts/ai-control-agent-launchd.sh'
      - 'scripts/ai-control-agent-unix-upgrade.sh'
      - 'scripts/ci-agent-runtime-smoke.py'
      - 'scripts/ci-agent-systemd-identity-smoke.sh'
      - 'scripts/ci-g6-windows-service-smoke.ps1'
      - 'scripts/ci-g7-unix-service-smoke.sh'
      - 'scripts/fixtures/broken-service-agent.go'
      - 'scripts/g4_state_db.py'
      - 'docs/API.md'
      - 'docs/G6_WINDOWS_SERVICE.md'
      - 'docs/G7_CROSS_PLATFORM.md'
      - '.github/workflows/go-agent.yml'
  workflow_dispatch:

concurrency:
  group: go-agent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-amd64
          - os: ubuntu-latest
            platform: linux-amd64
          - os: macos-15
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-amd64
    name: test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache: false

      - name: Go version
        run: go version
        working-directory: agent

      - name: Vet
        run: go vet ./...
        working-directory: agent

      - name: Test
        run: go test ./...
        working-directory: agent

      - name: Build
        run: go build ./cmd/ai-control-agent
        working-directory: agent

      - name: Validate Unix service scripts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n ./scripts/ai-control-agent-systemd.sh
          bash -n ./scripts/ai-control-agent-launchd.sh
          bash -n ./scripts/ai-control-agent-unix-upgrade.sh
          bash -n ./scripts/ci-g7-unix-service-smoke.sh
          bash -n ./scripts/ci-agent-systemd-identity-smoke.sh

      - name: Native runtime smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python .\scripts\ci-agent-runtime-smoke.py --agent .\agent\ai-control-agent.exe

      - name: Native runtime smoke (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: python3 ./scripts/ci-agent-runtime-smoke.py --agent ./agent/ai-control-agent

      - name: Windows service smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\ci-g6-windows-service-smoke.ps1

      - name: Linux systemd + SecretStore smoke
        if: matrix.platform == 'linux-amd64'
        shell: bash
        run: bash ./scripts/ci-g7-unix-service-smoke.sh

      - name: Linux Agent service identity migration smoke
        if: matrix.platform == 'linux-amd64'
        shell: bash
        run: bash ./scripts/ci-agent-systemd-identity-smoke.sh

      - name: macOS launchd + SecretStore smoke
        if: matrix.platform == 'darwin-arm64'
        shell: bash
        run: bash ./scripts/ci-g7-unix-service-smoke.sh

      - name: Upload Windows agent
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ai-control-agent-windows
          path: agent/ai-control-agent.exe
          if-no-files-found: error
          retention-days: 14

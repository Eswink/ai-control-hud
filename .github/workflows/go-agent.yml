name: Go Agent CI

on:
  push:
    paths:
      - 'agent/**'
      - 'server/tests/fixtures/**'
      - 'scripts/ci-g6-windows-service-smoke.ps1'
      - 'scripts/g4_state_db.py'
      - 'docs/API.md'
      - 'docs/G6_WINDOWS_SERVICE.md'
      - '.github/workflows/go-agent.yml'
  pull_request:
    paths:
      - 'agent/**'
      - 'server/tests/fixtures/**'
      - 'scripts/ci-g6-windows-service-smoke.ps1'
      - 'scripts/g4_state_db.py'
      - 'docs/API.md'
      - 'docs/G6_WINDOWS_SERVICE.md'
      - '.github/workflows/go-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache: false

      - name: Go version
        run: go version
        working-directory: agent

      - name: Vet
        run: go vet ./...
        working-directory: agent

      - name: Test
        run: go test ./...
        working-directory: agent

      - name: Build
        run: go build ./cmd/ai-control-agent
        working-directory: agent

      - name: Windows service smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\ci-g6-windows-service-smoke.ps1

      - name: Upload Windows agent
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ai-control-agent-windows
          path: agent/ai-control-agent.exe
          if-no-files-found: error
          retention-days: 14

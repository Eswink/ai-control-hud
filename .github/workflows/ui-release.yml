name: UI Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'android/**'
      - 'windows-ui/**'
      - 'scripts/ci-android-apk-secret-scan.py'
      - 'scripts/ci-android-ui-resources.py'
      - 'scripts/ci-windows-native-ui.py'
      - 'scripts/ci-windows-ui-artifact-scan.py'
      - 'scripts/ci-windows-ui-resource-smoke.ps1'
      - 'scripts/package-windows-ui.py'
      - '.github/workflows/ui-release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: Release version without a leading v
        required: true
        default: 0.4.0-rc.1
        type: string
      publish:
        description: Attach artifacts to the existing v<version> release
        required: true
        default: false
        type: boolean

concurrency:
  group: ui-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = $env:INPUT_VERSION
          }
          elseif ('${{ github.event_name }}' -eq 'pull_request') {
            $version = '0.0.0-pr.${{ github.event.pull_request.number }}'
          }
          else {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$') {
            throw "invalid release version: $version"
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Enforce native low-resource architecture
        shell: pwsh
        run: python scripts/ci-windows-native-ui.py

      - name: Configure native UI
        shell: pwsh
        run: cmake -S windows-ui -B build/windows-ui -A x64

      - name: Build native UI
        shell: pwsh
        run: cmake --build build/windows-ui --config Release --parallel

      - name: Verify reproducible Release EXE
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'build/windows-ui/Release/ai-control-agent-ui.exe').Path
          $first = Join-Path $env:RUNNER_TEMP 'ai-control-agent-ui-first.exe'
          Copy-Item -LiteralPath $exe -Destination $first -Force
          $hashA = (Get-FileHash -Algorithm SHA256 -LiteralPath $first).Hash
          cmake --build build/windows-ui --config Release --target clean
          cmake --build build/windows-ui --config Release --parallel
          $hashB = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash
          if ($hashA -ne $hashB) {
            throw "native Windows UI Release EXE is not reproducible: $hashA != $hashB"
          }
          Write-Host "[windows-ui-repro] PASS sha256=$hashA"

      - name: Run native model tests
        shell: pwsh
        run: ctest --test-dir build/windows-ui -C Release --output-on-failure

      - name: Scan native Windows UI artifact
        shell: pwsh
        run: python scripts/ci-windows-ui-artifact-scan.py build/windows-ui/Release/ai-control-agent-ui.exe

      - name: Native startup resource and leak smoke
        shell: pwsh
        run: |
          ./scripts/ci-windows-ui-resource-smoke.ps1 `
            -Exe 'build/windows-ui/Release/ai-control-agent-ui.exe' `
            -MetricsPath 'build/windows-ui/resource-metrics.json'

      - name: Package versioned Windows UI release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $bundle = "dist/ai-control-agent-ui_$env:RELEASE_VERSION`_windows-amd64.zip"
          python scripts/package-windows-ui.py `
            --exe 'build/windows-ui/Release/ai-control-agent-ui.exe' `
            --metrics 'build/windows-ui/resource-metrics.json' `
            --version "$env:RELEASE_VERSION" `
            --output $bundle
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $bundle).Hash.ToLowerInvariant()
          $name = Split-Path -Leaf $bundle
          "$digest  $name" | Set-Content -LiteralPath "$bundle.sha256" -Encoding ascii
          Write-Host "[windows-ui-release] sha256=$digest"

      - name: Verify Windows UI release bundle
        shell: pwsh
        run: |
          $bundle = (Resolve-Path "dist/ai-control-agent-ui_$env:RELEASE_VERSION`_windows-amd64.zip").Path
          $root = Join-Path $env:RUNNER_TEMP 'windows-ui-release-bundle'
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          Expand-Archive -LiteralPath $bundle -DestinationPath $root
          foreach ($name in @('ai-control-agent-ui.exe','resource-metrics.json','README.md','BUILD_INFO.txt','SHA256SUMS')) {
            if (-not (Test-Path (Join-Path $root $name))) { throw "bundle member missing: $name" }
          }
          python scripts/ci-windows-ui-artifact-scan.py (Join-Path $root 'ai-control-agent-ui.exe')
          foreach ($line in Get-Content (Join-Path $root 'SHA256SUMS')) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "invalid SHA256SUMS row: $line" }
            $expected = $Matches[1]
            $name = $Matches[2]
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $root $name)).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "checksum mismatch for $name" }
          }
          Select-String -LiteralPath (Join-Path $root 'BUILD_INFO.txt') -SimpleMatch "version=$env:RELEASE_VERSION" | Out-Null

      - name: Upload Windows UI release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ui-release-windows
          path: |
            dist/ai-control-agent-ui_${{ env.RELEASE_VERSION }}_windows-amd64.zip
            dist/ai-control-agent-ui_${{ env.RELEASE_VERSION }}_windows-amd64.zip.sha256
          if-no-files-found: error
          retention-days: 90

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android 35 SDK
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Enforce localized low-resource UI foundation
        run: python3 scripts/ci-android-ui-resources.py

      - name: Resolve release version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            workflow_dispatch) version="$INPUT_VERSION" ;;
            pull_request) version="0.0.0-pr.${{ github.event.pull_request.number }}" ;;
            *) version="${GITHUB_REF_NAME#v}" ;;
          esac
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release version: $version" >&2
            exit 1
          fi
          version_code="$GITHUB_RUN_NUMBER"
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo 'workflow run number cannot be used as Android versionCode' >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "HUD_ANDROID_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "HUD_ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"

      - name: Materialize Android signing identity
        shell: bash
        env:
          PROD_KEYSTORE_BASE64: ${{ secrets.HUD_ANDROID_KEYSTORE_BASE64 }}
          PROD_STORE_PASSWORD: ${{ secrets.HUD_ANDROID_KEYSTORE_PASSWORD }}
          PROD_KEY_ALIAS: ${{ secrets.HUD_ANDROID_KEY_ALIAS }}
          PROD_KEY_PASSWORD: ${{ secrets.HUD_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="${RUNNER_TEMP}/ai-control-hud-release.jks"
          all_prod=true
          for value in "$PROD_KEYSTORE_BASE64" "$PROD_STORE_PASSWORD" "$PROD_KEY_ALIAS" "$PROD_KEY_PASSWORD"; do
            if [[ -z "$value" ]]; then all_prod=false; fi
          done

          if [[ "$GITHUB_EVENT_NAME" != 'pull_request' && "$all_prod" == true ]]; then
            printf '%s' "$PROD_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            store_password="$PROD_STORE_PASSWORD"
            key_alias="$PROD_KEY_ALIAS"
            key_password="$PROD_KEY_PASSWORD"
            signing_kind=production
          else
            if [[ "$GITHUB_EVENT_NAME" != 'pull_request' && "$RELEASE_VERSION" != *-* ]]; then
              echo 'stable releases require all HUD_ANDROID_* production signing secrets' >&2
              exit 1
            fi
            store_password='aicontrolhud-ci-release'
            key_password='aicontrolhud-ci-release'
            key_alias='aicontrolhud-ci-release'
            keytool -genkeypair -noprompt \
              -keystore "$keystore" \
              -storepass "$store_password" \
              -keypass "$key_password" \
              -alias "$key_alias" \
              -keyalg RSA -keysize 2048 -validity 2 \
              -dname 'CN=AI Control HUD CI Release, OU=CI, O=AI Control HUD, L=CI, ST=CI, C=US'
            signing_kind=ephemeral-ci
          fi

          chmod 600 "$keystore"
          test -s "$keystore"
          echo "HUD_ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "HUD_ANDROID_KEYSTORE_PASSWORD=$store_password" >> "$GITHUB_ENV"
          echo "HUD_ANDROID_KEY_ALIAS=$key_alias" >> "$GITHUB_ENV"
          echo "HUD_ANDROID_KEY_PASSWORD=$key_password" >> "$GITHUB_ENV"
          echo "ANDROID_SIGNING_KIND=$signing_kind" >> "$GITHUB_ENV"

      - name: Build signed Android release APK
        working-directory: android
        run: gradle --no-daemon :app:lintRelease :app:testReleaseUnitTest :app:assembleRelease

      - name: Verify and package Android release APK
        shell: bash
        run: |
          set -euo pipefail
          apk='android/app/build/outputs/apk/release/app-release.apk'
          build_tools="${ANDROID_HOME}/build-tools/35.0.0"
          test -f "$apk"
          "${build_tools}/apksigner" verify --verbose --print-certs "$apk"
          badging="$("${build_tools}/aapt" dump badging "$apk" | head -n 1)"
          grep -F "versionCode='${HUD_ANDROID_VERSION_CODE}'" <<<"$badging"
          grep -F "versionName='${HUD_ANDROID_VERSION_NAME}'" <<<"$badging"
          "${build_tools}/aapt2" dump resources "$apk" > /tmp/hud-release-resources.txt
          grep -F 'activity_main' /tmp/hud-release-resources.txt
          "${build_tools}/aapt2" dump configurations "$apk" > /tmp/hud-release-configurations.txt
          grep -E '^land($|-)' /tmp/hud-release-configurations.txt
          python3 scripts/ci-android-apk-secret-scan.py "$apk"
          mkdir -p dist
          release_apk="dist/ai-control-hud_${RELEASE_VERSION}_android.apk"
          cp "$apk" "$release_apk"
          sha256sum "$release_apk" > "$release_apk.sha256"
          cat > dist/android-release-metadata.txt <<EOF
          applicationId=dev.eswink.aicontrolhud
          versionName=${HUD_ANDROID_VERSION_NAME}
          versionCode=${HUD_ANDROID_VERSION_CODE}
          commit=${GITHUB_SHA}
          ref=${GITHUB_REF_NAME}
          signing=${ANDROID_SIGNING_KIND}
          workflowRunId=${GITHUB_RUN_ID}
          EOF

      - name: Upload Android release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ui-release-android
          path: |
            dist/ai-control-hud_${{ env.RELEASE_VERSION }}_android.apk
            dist/ai-control-hud_${{ env.RELEASE_VERSION }}_android.apk.sha256
            dist/android-release-metadata.txt
          if-no-files-found: error
          retention-days: 90

      - name: Remove materialized signing key
        if: always()
        shell: bash
        run: rm -f "${HUD_ANDROID_KEYSTORE_PATH:-${RUNNER_TEMP}/ai-control-hud-release.jks}"

  attest:
    if: github.event_name != 'pull_request'
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download UI release artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: ui-release-*
          path: dist
          merge-multiple: true

      - name: Attest UI release artifacts
        uses: actions/attest@v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.apk
            dist/*.sha256
            dist/android-release-metadata.txt

  publish:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [windows, android, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve publish target
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' ]]; then
            version="$INPUT_VERSION"
            tag="$GITHUB_REF_NAME"
            if [[ "$tag" != "v$version" ]]; then
              echo "workflow_dispatch must run from tag v$version, got $tag" >&2
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Download UI release artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: ui-release-*
          path: dist
          merge-multiple: true

      - name: Wait for unified Go release and attach UI assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" dist/* --clobber
              if [[ "$RELEASE_VERSION" == *-* ]]; then
                gh release edit "$RELEASE_TAG" --prerelease
              fi
              echo "attached UI assets to $RELEASE_TAG"
              exit 0
            fi
            echo "waiting for Go release publication ($attempt/60)"
            sleep 10
          done
          echo "GitHub release $RELEASE_TAG was not published by the Go release workflow" >&2
          exit 1
